<!DOCTYPE html>
<html>

<head>

    <title>Change Password</title>

    <style>

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f8fc;
            padding: 40px;
        }

        .card {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 13px;
            box-shadow: 0 3px 12px rgba(20,40,80,.08);
        }

        h2 {
            margin-bottom: 8px;
        }

        p {
            color: #7a879a;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #dce3ed;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            background: #1769e0;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-left: 10px;
            color: #1769e0;
            text-decoration: none;
        }

        .errorlist {
            color: #d7283a;
            font-size: 13px;
        }

    </style>

</head>

<body>

<div class="card">

    <h2>Change Password</h2>

    <p>
        Update your account password.
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Change Password
        </button>

        <a href="{% url 'candidate_settings' %}"
           class="back">
            Cancel
        </a>

    </form>

</div>

</body>

</html>
