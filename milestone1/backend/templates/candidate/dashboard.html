<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }
        .card-box{
            color:white;
            border-radius:10px;
            padding:20px;
            text-align:center;
            box-shadow:0 4px 8px rgba(0,0,0,.1);
        }
        .action-card{
            background:white;
            border-radius:10px;
            padding:30px;
            text-align:center;
            box-shadow:0 3px 8px rgba(0,0,0,.08);
            transition:.3s;
        }
        .action-card:hover{
            transform:translateY(-5px);
        }
    </style>

</head>
<body>

<div class="container mt-4">

    <h2>Candidate Dashboard</h2>

    <p>Welcome Candidate!</p>

    <div class="row mt-4">

        <div class="col-md-3">
            <div class="card-box bg-primary">
                <h3>4</h3>
                Applications
            </div>
        </div>

        <div class="col-md-3">
            <div class="card-box bg-warning">
                <h3>2</h3>
                Under Review
            </div>
        </div>

        <div class="col-md-3">
            <div class="card-box bg-success">
                <h3>1</h3>
                Interviews
            </div>
        </div>

        <div class="col-md-3">
            <div class="card-box bg-danger">
                <h3>1</h3>
                Rejected
            </div>
        </div>

    </div>

    <h4 class="mt-5">Quick Actions</h4>

    <div class="row mt-3">

        <div class="col-md-4">
            <div class="action-card">
                <a href="/candidate/jobs/" class="btn btn-primary">
                    Browse Jobs
                </a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="action-card">
                <a href="/candidate/applications/" class="btn btn-success">
                    My Applications
                </a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="action-card">
                <a href="/candidate/profile/" class="btn btn-warning">
                    Update Profile
                </a>
            </div>
        </div>

    </div>

    <h4 class="mt-5">Recent Applications</h4>

    <table class="table table-bordered bg-white">

        <tr>
            <th>Job Title</th>
            <th>Company</th>
            <th>Status</th>
        </tr>

        <tr>
            <td>Software Engineer</td>
            <td>Google</td>
            <td><span class="badge bg-success">Shortlisted</span></td>
        </tr>

    </table>

</div>

</body>
</html>
