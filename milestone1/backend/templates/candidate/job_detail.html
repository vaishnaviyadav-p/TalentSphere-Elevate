<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ job.title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fa;
        }

        .job-card{
            background:white;
            border-radius:12px;
            padding:30px;
            box-shadow:0 5px 12px rgba(0,0,0,.1);
        }

        .company{
            color:#0d6efd;
            font-weight:bold;
        }

        .salary{
            color:green;
            font-size:20px;
            font-weight:bold;
        }
    </style>

</head>

<body>

<div class="container mt-5">

    <div class="job-card">

        <h2>{{ job.title }}</h2>

        <h4 class="company">{{ job.company }}</h4>

        <p>📍 {{ job.location }}</p>

        <p class="salary">₹ {{ job.salary }}</p>

        <hr>

        <h4>Job Description</h4>

        <p>{{ job.description }}</p>

        <h4>Requirements</h4>

        <ul>
            <li>Python</li>
            <li>Django</li>
            <li>SQL</li>
            <li>Git & GitHub</li>
        </ul>

        <a href="{% url 'apply_job' job.id %}" class="btn btn-success btn-lg">
    Apply Now
</a>
        <a href="/candidate/jobs/" class="btn btn-secondary btn-lg">
            Back
        </a>

    </div>

</div>

</body>
</html>
