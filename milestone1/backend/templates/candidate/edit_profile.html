{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container mt-5">
    <div class="card p-4">
        <h2 class="text-center mb-4">Edit Candidate Profile</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                {{ form.full_name }}
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                {{ form.phone }}
            </div>

            <div class="mb-3">
                <label class="form-label">Location</label>
                {{ form.location }}
            </div>

            <div class="mb-3">
                <label class="form-label">Education</label>
                {{ form.education }}
            </div>

            <div class="mb-3">
                <label class="form-label">Skills</label>
                {{ form.skills }}
            </div>

            <div class="mb-3">
                <label class="form-label">Experience</label>
                {{ form.experience }}
            </div>

            <div class="mb-3">
                <label class="form-label">Bio</label>
                {{ form.bio }}
            </div>

            <div class="mb-3">
                <label class="form-label">Profile Image</label>
                {{ form.profile_image }}
            </div>

            <button type="submit" class="btn btn-primary">
                Save Profile
            </button>

            <a href="{% url 'candidate_profile' %}" class="btn btn-secondary">
                Cancel
            </a>
        </form>
    </div>
</div>

{% endblock %}
