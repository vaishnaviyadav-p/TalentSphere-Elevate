<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Analytics Dashboard</title>
    
    <!-- 1. Include Chart.js Library in Head -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
            margin: 0;
        }
        .dashboard-header {
            margin-bottom: 25px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
        }
        .stat-card h4 {
            margin: 0 0 10px 0;
            color: #6c757d;
        }
        .stat-card p {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }
        .chart-card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            min-height: 350px;
        }
        .chart-card h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #333;
            font-size: 18px;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 300px;
        }
    </style>
</head>
<body>

    <div class="dashboard-header">
        <h2>Analytics Dashboard</h2>
    </div>

    <!-- Overview Counters -->
    <div class="stats-grid">
        <div class="stat-card">
            <h4>Total Jobs</h4>
            <p>{{ total_jobs }}</p>
        </div>
        <div class="stat-card">
            <h4>Total Applications</h4>
            <p>{{ total_applications }}</p>
        </div>
        <div class="stat-card">
            <h4>Shortlisted</h4>
            <p>{{ shortlisted }}</p>
        </div>
        <div class="stat-card">
            <h4>Interviews</h4>
            <p>{{ interviews }}</p>
        </div>
    </div>

    <!-- Charts Container -->
    <div class="charts-grid">
        <!-- 1. Monthly Jobs Bar Chart -->
        <div class="chart-card">
            <h3>Job Postings per Month</h3>
            <div class="canvas-container">
                <canvas id="monthlyJobsChart"></canvas>
            </div>
        </div>

        <!-- 2. Weekly Jobs Bar Chart -->
        <div class="chart-card">
            <h3>Job Postings per Week</h3>
            <div class="canvas-container">
                <canvas id="weeklyJobsChart"></canvas>
            </div>
        </div>

        <!-- 3. Application Status Pie Chart -->
        <div class="chart-card">
        <h3>Recruitment Trend</h3>
        <div style="position: relative; height: 300px;">
            <canvas id="recruitmentTrendChart"></canvas>
        </div>
    </div>
    </div>

    
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Parse ONLY variables sent from updated context
        const monthLabels = JSON.parse('{{ month_labels_json|escapejs }}');
        const monthData = JSON.parse('{{ month_data_json|escapejs }}');
        const weekLabels = JSON.parse('{{ week_labels_json|escapejs }}');
        const weekData = JSON.parse('{{ week_data_json|escapejs }}');

        // 1. Monthly Recruitment Trend (Bar / Line)
        const ctxMonthly = document.getElementById('monthlyJobsChart');
        if (ctxMonthly) {
            new Chart(ctxMonthly, {
                type: 'bar',
                data: {
                    labels: monthLabels,
                    datasets: [{
                        label: 'Jobs Posted (Monthly)',
                        data: monthData,
                        backgroundColor: 'rgba(54, 162, 235, 0.6)'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
            });
        }

        // 2. Weekly Recruitment Trend
        const ctxWeekly = document.getElementById('weeklyJobsChart');
        if (ctxWeekly) {
            new Chart(ctxWeekly, {
                type: 'bar',
                data: {
                    labels: weekLabels,
                    datasets: [{
                        label: 'Jobs Posted (Weekly)',
                        data: weekData,
                        backgroundColor: 'rgba(75, 192, 192, 0.6)'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
            });
        }

        // 3. Recruitment Line Trend
        const ctxTrend = document.getElementById('recruitmentTrendChart');
        if (ctxTrend) {
            new Chart(ctxTrend, {
                type: 'line',
                data: {
                    labels: monthLabels,
                    datasets: [{
                        label: 'Recruitment Trend',
                        data: monthData,
                        borderColor: 'rgba(54, 162, 235, 1)',
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
            });
        }
    });
</script>
</body>
</html>
