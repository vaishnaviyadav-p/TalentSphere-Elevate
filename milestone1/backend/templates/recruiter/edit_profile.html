{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container mt-5">
    <div class="card p-4">
        <h2 class="text-center mb-4">Edit Recruiter Profile</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Recruiter Name</label>
                {{ form.recruiter_name }}
            </div>

            <div class="mb-3">
                <label class="form-label">Company Name</label>
                {{ form.company_name }}
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                {{ form.email }}
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                {{ form.phone }}
            </div>

            <div class="mb-3">
                <label class="form-label">Location</label>
                {{ form.location }}
            </div>

            <div class="mb-3">
                <label class="form-label">Company Description</label>
                {{ form.company_description }}
            </div>

            <div class="mb-3">
                <label class="form-label">Company Logo</label>
                {{ form.company_logo }}
            </div>

            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>

            <a href="{% url 'recruiter_profile' %}" class="btn btn-secondary">
                Cancel
            </a>
        </form>
    </div>
</div>

{% endblock %}
