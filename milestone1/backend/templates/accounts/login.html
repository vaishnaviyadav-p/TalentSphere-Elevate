<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login | TalentSphere Elevate</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Poppins',sans-serif;
    background:#eef5ff;
}

.login-box{
    max-width:500px;
    margin:70px auto;
    background:white;
    padding:45px;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    color:#0d6efd;
    font-weight:bold;
    font-size:32px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:35px;
}

.btn-login{
    width:100%;
    border-radius:10px;
    padding:12px;
}

.form-control{
    border-radius:10px;
}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">
TalentSphere Elevate
</div>

<div class="subtitle">
AI-Powered Recruitment & ATS
</div>

<h3 class="text-center mb-4">Welcome Back</h3>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">Username</label>

<input
type="text"
name="username"
class="form-control"
placeholder="Enter Username">

</div>

<div class="mb-3">

<label class="form-label">Password</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter Password">

</div>

<div class="d-flex justify-content-between mb-4">

<div>

<input type="checkbox">

Remember me

</div>

<a href="#">Forgot Password?</a>

</div>

<button class="btn btn-primary btn-login">

Login

</button>

<p class="text-center mt-4">

Don't have an account?

<a href="/register/">

Register

</a>

</p>

</form>

</div>

</body>
</html>
