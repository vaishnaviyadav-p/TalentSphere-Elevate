<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | TalentSphere Elevate</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right,#eef5ff,#dbeafe);
            height:100vh;
        }

        .register-card{
            border:none;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.15);
        }

        .left{
            padding:50px;
        }

        .right{
            background:#0d6efd;
            color:white;
            border-radius:0 20px 20px 0;
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:30px;
        }

        .btn-custom{
            background:#0d6efd;
            color:white;
            width:100%;
        }

        .btn-custom:hover{
            background:#084298;
            color:white;
        }
    </style>
</head>

<body>

<div class="container mt-5">

<div class="card register-card">

<div class="row g-0">

<div class="col-md-6 left">

<h2 class="fw-bold mb-4">Create Account</h2>
{% if form.errors %}

<div class="alert alert-danger">  
    {{ form.errors }}  
</div>  
{% endif %} 

<form method="POST" action="">

{% csrf_token %}

<div class="mb-3">
<label class="form-label">Username</label>
<input type="text" class="form-control" name="username">
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" name="email">
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input type="password" class="form-control" name="password">
</div>

<div class="mb-3">
<label class="form-label">Role</label>

<select class="form-select" name="role">
<option value="candidate">Candidate</option>
<option value="recruiter">Recruiter</option>
</select>
</div>

<button type="submit" class="btn btn-custom">
Register
</button>

</form>

</div>

<div class="col-md-6 right">

<div>

<h1>TalentSphere Elevate</h1>

<h5>AI Powered Recruitment & ATS</h5>

<p class="mt-4">
Build your career or hire the best candidates using our intelligent recruitment platform.
</p>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
