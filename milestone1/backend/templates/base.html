{% load static %}

<html lang="en">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">TalentSphere</a>

        <div class="ms-auto">
            <a href="#" class="btn btn-light btn-sm">Dashboard</a>
            <a href="#" class="btn btn-warning btn-sm">Profile</a>
            <a href="#" class="btn btn-danger btn-sm">Logout</a>

    </div>

<div class="container mt-4">
