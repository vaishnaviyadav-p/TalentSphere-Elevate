{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TalentSphere{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">TalentSphere</a>

        <div class="ms-auto">

    {% if  user.userprofile.role == "candidate" %}

        <a href="{% url 'candidate_dashboard' %}" class="btn btn-light btn-sm">
            Dashboard
        </a>

        <a href="{% url 'candidate_profile' %}" class="btn btn-warning btn-sm">
            Profile
        </a>

    {% elif user.userprofile.role == "recruiter" %}

        <a href="{% url 'recruiter_dashboard' %}" class="btn btn-light btn-sm">
            Dashboard
        </a>

        <a href="{% url 'recruiter_profile' %}" class="btn btn-warning btn-sm">
            Profile
        </a>

    {% endif %}

    <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">
        Logout
    </a>

</div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
